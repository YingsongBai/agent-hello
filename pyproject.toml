[project]
name = "agent-hello"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "baiyingsong", email = "chuhe@micous.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncmy>=0.2.14",
    "cryptography>=50.0.1",
    "elasticsearch[async]>=8,<9",
    "fastapi[standard]>=0.141.1",
    "jieba>=0.42.1",
    "langchain>=1.4.0",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.11",
    "loguru>=0.7.3",
    "omegaconf>=2.3.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
agent-hello = "agent_hello:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
